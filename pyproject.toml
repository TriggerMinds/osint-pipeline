[project]
name = "osint-pipeline"
version = "0.1.0"
description = "AI-driven OSINT/research pipeline for public sources, archives, and multilingual discovery"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "TriggerMinds"},
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "httpx[socks]>=0.27",
    "rich>=13.0",
    "openai>=1.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
proxy = ["httpx[socks]"]
crawl = ["crawl4ai>=0.4"]
browser = ["playwright>=1.40"]
runtime = ["crawl4ai>=0.4", "playwright>=1.40"]

[project.scripts]
osint = "osint_pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["osint_pipeline*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
