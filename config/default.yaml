pipeline:
  max_concurrent_fetches: 10
  request_timeout_seconds: 30
  max_queries_per_intent: 25
  max_sources_per_query: 50
  max_archive_snapshots: 10
  evidence_min_confidence: 0.3

providers:
  deepseek:
    model: deepseek-reasoner
    temperature: 0.1
    max_tokens: 8192

sources:
  searxng:
    base_url: http://localhost:8888
    instances:
      - https://search.sapti.me
      - https://searx.be
    max_results: 20
    engines:
      - google
      - bing
      - duckduckgo
      - wikipedia
      - news
  gdelt:
    base_url: https://api.gdeltproject.org/api/v2
    max_records: 250
    timeframe: 7d
  common_crawl:
    base_url: https://index.commoncrawl.org
    max_pages: 50
  internet_archive:
    cdx_url: https://web.archive.org/cdx/search/cdx
    wayback_url: https://web.archive.org/web
    max_snapshots: 20
  waymore:
    enabled: false
    binary_path: waymore

multilingual:
  target_languages:
    - en
    - ru
    - zh
    - ar
    - es
    - fr
    - de
    - fa
    - tr
    - uk
    - pt
    - ja
    - ko

graphrag:
  entity_extraction_model: deepseek-reasoner
  relation_extraction_model: deepseek-reasoner
  max_entities_per_doc: 100
  embedding_model: text-embedding-3-small

output:
  format: json
  include_raw_sources: true
  max_citations_per_claim: 5
